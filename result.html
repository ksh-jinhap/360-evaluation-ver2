<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>다면평가 개인결과 조회</title>
<style>
:root{--nv:#1a3a5c;--nv2:#2563a8;--bd:#d0d7e3;--bd2:#b0bcd0;--bg:#f4f6fb;--tx:#1a2a3a;--tx2:#3a5a7a;--tx3:#7a90a8;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

/* ── 로그인 ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a3a5c 0%,#2563a8 100%)}
.login-box{background:#fff;border-radius:20px;padding:44px 38px 36px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(26,58,92,.18)}
.login-logo{width:64px;height:64px;background:var(--nv2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px}
.login-title{text-align:center;font-size:24px;font-weight:800;color:var(--nv);margin-bottom:4px}
.login-sub{text-align:center;font-size:14px;color:var(--tx3);margin-bottom:28px}
.lfield{margin-bottom:14px}
.lfield label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.lfield input{width:100%;padding:11px 14px;border:1.5px solid var(--bd);border-radius:8px;font-size:15px;font-family:inherit;outline:none;transition:.15s}
.lfield input:focus{border-color:var(--nv2);box-shadow:0 0 0 3px rgba(37,99,168,.12)}
.btn-login{width:100%;padding:13px;background:var(--nv2);color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;transition:.15s}
.btn-login:hover{background:#1a3a5c}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.login-err{color:#c62828;font-size:14px;text-align:center;margin-top:10px;min-height:20px}
.login-notice{text-align:center;font-size:13px;color:var(--tx3);margin-top:16px;line-height:1.6}

/* ── 결과 화면 ── */
.result-wrap{display:none;min-height:100vh;background:var(--bg)}
.topbar{background:var(--nv);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-l{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.topbar-badge{background:#fff2;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600}
.topbar-r{display:flex;align-items:center;gap:12px;font-size:14px}
.btn-out{background:#fff2;border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit}
.btn-out:hover{background:#fff3}

.result-inner{max-width:900px;margin:0 auto;padding:28px 16px 60px}
.result-name{font-size:22px;font-weight:800;color:var(--nv);margin-bottom:6px}
.result-sub{font-size:14px;color:var(--tx3);margin-bottom:24px}

/* 탭 */
.tab-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:8px 18px;border:1.5px solid var(--bd);border-radius:20px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--tx2);transition:.15s}
.tab-btn.on{background:var(--nv2);border-color:var(--nv2);color:#fff}

/* 카드 */
.card{background:#fff;border-radius:var(--r);box-shadow:0 2px 12px rgba(26,58,92,.07);padding:24px;margin-bottom:20px}
.card h3{font-size:17px;font-weight:700;color:var(--nv);margin-bottom:16px}

/* 레이더 */
.radar-wrap{position:relative;width:100%;max-width:520px;margin:0 auto}
.radar-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:14px;justify-content:center}
.radar-legend span{display:flex;align-items:center;gap:6px}
.radar-legend i{display:inline-block;width:22px;height:3px;border-radius:2px}
.radar-tooltip{display:none;position:absolute;z-index:20;min-width:170px;max-width:260px;
  padding:10px 12px;border-radius:9px;background:rgba(18,31,49,.94);color:#fff;
  font-size:12px;line-height:1.55;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none}
.radar-tooltip strong{display:block;font-size:13px;margin-bottom:4px}
.radar-tooltip .tip-row{display:flex;justify-content:space-between;gap:12px;white-space:nowrap}
.radar-tooltip .tip-value{font-weight:800}

/* 점수표 */
.score-tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.score-tbl th{background:#f0f4fa;color:var(--tx2);padding:9px 12px;text-align:left;font-weight:700;border-bottom:2px solid var(--bd)}
.score-tbl td{padding:8px 12px;border-bottom:1px solid var(--bd);color:var(--tx)}
.score-tbl tr:last-child td{border-bottom:none}
.score-my{font-weight:700;color:#1565c0;text-align:center}
.score-team{color:#2e7d52;text-align:center}
.score-all{color:#e64a19;text-align:center}
.score-tbl.compare-wide{min-width:900px}
.diff-cell{text-align:center;font-weight:700;white-space:nowrap}
.diff-pos{color:#2e7d52}.diff-neg{color:#c62828}.diff-neutral{color:var(--tx3)}
.status-badge{display:inline-flex;align-items:center;justify-content:center;min-width:48px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.status-strength{background:#e8f5e9;color:#1b5e20}
.status-improve{background:#ffebee;color:#b71c1c}
.status-similar{background:#eef2f7;color:#52667c}
.row-strength td:first-child{font-weight:700;color:#1b5e20}
.row-improve td:first-child{font-weight:700;color:#b71c1c}
.analysis-summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.analysis-chip{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:800}
.analysis-chip.strength{background:#e8f5e9;color:#1b5e20}
.analysis-chip.improve{background:#ffebee;color:#b71c1c}
.analysis-chip.similar{background:#eef2f7;color:#52667c}
.analysis-rule{font-size:12px;color:var(--tx3);margin-left:auto}
.analysis-highlights{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.analysis-box{border:1px solid var(--bd);background:#fafcff;border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--tx2)}
.analysis-box strong{color:var(--nv);margin-right:4px}
.analysis-note{font-size:11px;color:var(--tx3);margin-top:10px;line-height:1.5}
.scope-badge{display:inline-flex;padding:4px 9px;border-radius:999px;background:#eef4fb;color:var(--nv2);font-size:12px;font-weight:800;margin-left:6px}

/* no-data */
.no-data{text-align:center;padding:40px 20px;color:var(--tx3);font-size:15px}

/* 척도 설명 */
.scale-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.scale-chip{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.sc6{background:#1565c0}.sc5{background:#2e7d52}.sc4{background:#558b2f}
.sc3{background:#f9a825;color:#333}.sc2{background:#e64a19}.sc1{background:#b71c1c}

@media(max-width:600px){
  .login-box{padding:32px 20px 28px;margin:16px}
  .result-inner{padding:16px 10px 40px}
  .score-tbl{font-size:13px}
  .analysis-highlights{grid-template-columns:1fr}
  .analysis-rule{width:100%;margin-left:0}
  .radar-tooltip{font-size:11px;max-width:220px}
}

/* 팀원 결과 조회 */
.member-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.member-chip{padding:8px 16px;border:1.5px solid var(--bd);border-radius:20px;
  cursor:pointer;font-size:14px;background:#fff;transition:.15s;text-align:center}
.member-chip:hover{border-color:var(--nv2);color:var(--nv2);background:#f0f4ff}
.member-chip.on{border-color:var(--nv2);background:var(--nv2);color:#fff}
.member-chip .chip-team{font-size:11px;opacity:.75;display:block;margin-top:2px}
.org-group{margin-bottom:20px}
.org-group-title{font-size:13px;font-weight:700;color:var(--tx3);
  padding:4px 10px;background:#f0f4fa;border-radius:6px;margin-bottom:8px;display:inline-block}
.member-loading{text-align:center;padding:40px;color:var(--tx3)}
.back-btn{padding:7px 16px;border:1.5px solid var(--bd);border-radius:8px;
  background:#fff;cursor:pointer;font-size:14px;font-family:inherit;margin-bottom:16px}
.back-btn:hover{border-color:var(--nv2);color:var(--nv2)}
</style>


</head>
<body>

<!-- 로그인 화면 -->
<div class="login-wrap" id="pg-login">
  <div class="login-box">
    <div class="login-logo">📊</div>
    <div class="login-title">개인결과 조회</div>
    <div class="login-sub">다면평가 2026</div>
    <div class="lfield">
      <label>이름</label>
      <input type="text" id="li-name" placeholder="이름을 입력하세요" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="lfield">
      <label>사번</label>
      <input type="text" id="li-emp" placeholder="숫자 6자리" maxlength="6" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="lfield">
      <label>주민번호 뒷 3자리</label>
      <input type="password" id="li-jumin" placeholder="숫자 3자리" maxlength="3" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">조회하기</button>
    <div class="login-err" id="li-err"></div>
    <div class="login-notice">해당 평가는 모두 익명으로 진행되었습니다.<br>부여된 조회범위 내 결과만 확인할 수 있습니다.</div>
  </div>
</div>

<!-- 결과 화면 -->
<div class="result-wrap" id="pg-result">
  <div class="topbar">
    <div class="topbar-l">
      📊 <span>개인결과 조회</span>
      <span class="topbar-badge">2026년도</span>
    </div>
    <div class="topbar-r">
      <span id="top-name"></span>
      <button class="btn-out" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="result-inner">
    <div class="result-name" id="res-name"></div>
    <div class="result-sub" id="res-sub"></div>

    <!-- 평가유형 탭 -->
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
    <div class="tab-bar" id="type-tabs" style="margin-bottom:0"></div>
    <div id="team-tab-wrap" style="display:none">
      <button id="team-tab-btn" class="tab-btn"
        onclick="showTeamView()" style="background:#fff3e0;border-color:#e65100;color:#e65100">
        <span id="team-tab-btn-label">👥 조직 구성원 결과</span>
      </button>
    </div>
  </div>

    <!-- 결과 카드 영역 -->
    <div id="result-cards"></div>
  <div id="team-view" style="display:none"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// GAS URL 설정
// ════════════════════════════════════════
const GAS_URL = "https://script.google.com/macros/s/AKfycbw69xtBTlGLjH181_r0OrXC5oGdoXRyFLx57A2qBUy5V11qWmSmN2_eEo_0mWpuG3o71A/exec";

const FORM_LABEL = {
  peer:      '동료평가',
  collab:    '협업평가',
  super_mgr: '상사평가 (상사용)',
  super_ceo: '상사평가 (법인대표용)'
};

// 우클릭/F12 차단
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
  document.addEventListener('keydown',function(e){
    if(e.key==='F12'){e.preventDefault();return false;}
    if(e.ctrlKey&&e.key.toLowerCase()==='u'){e.preventDefault();return false;}
    if(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(e.key.toLowerCase())){e.preventDefault();return false;}
  });
})();

// 항목명 매핑 (원본키 → 표시명)
const ITEM_MAP = {
  '적극성/업무에 임하는 자세가':'적극성',
  '책임감/맡은 일은 끝까지 완수':'책임감',
  '협조성/소속부서 및 타부서에':'협조성',
  '규율성/조직의 규정과 규칙을':'규율성',
  '업무지식/담당업무 지식 및 관련':'업무지식',
  '실행력/난관에 부딪히면 해결방':'실행력',
  '업무수행능력/이해판단력':'이해판단력',
  '업무수행능력/의사소통':'의사소통',
  '업무수행능력/창의력':'창의력',
  '업무수행능력/업무수행':'업무수행',
  '대인관계/매사 표정이 밝고, 언':'대인관계',
  '충고와 조언, 질책을 적절히':'조직관리 및 소통 Ⅰ',
  '면담 또는 관찰을 통해 부하':'조직관리 및 소통 Ⅱ',
  '조직내 상사, 동료, 부하직':'조직관리 및 소통 Ⅲ',
  '평소 말과 행동이 일치하며':'솔선수범 및 책임감 Ⅰ',
  '선택과 결정에 합리적인 기준':'솔선수범 및 책임감 Ⅱ',
  '조직의 발전을 위해 공과 사':'솔선수범 및 책임감 Ⅲ',
  '목적과 목표를 정확하게 설정':'목표설정 및 판단력 Ⅰ',
  '상황의 핵심을 정확하게 판단':'목표설정 및 판단력 Ⅱ',
  '상황의 핵심을 정확히 판단':'목표설정 및 판단력 Ⅱ',
  '전문지식과 정보를 상황에 맞':'목표설정 및 판단력 Ⅲ',
  '여러 가지 상황을 종합적으로':'결단력 Ⅰ',
  '문제해결을 위한 선택과 결단':'결단력 Ⅱ',
  '목표달성을 위한 집념을 가지':'업무추진력 Ⅰ',
  '어려운 목표를 포기하지 않고':'업무추진력 Ⅱ',
};

const EXCLUDE_ITEMS = ['업무수행능력/실행력'];

function cleanLabel(item) {
  if (!item) return item;
  // 줄바꿈 제거
  const t = item.replace(/\n/g,'').trim();
  // 정확 매칭
  if (ITEM_MAP[t]) return ITEM_MAP[t];
  // "/" 뒤 세부항목으로 매칭
  const si = t.lastIndexOf('/');
  if (si > -1) {
    const sub = t.slice(si+1).trim();
    if (ITEM_MAP[sub]) return ITEM_MAP[sub];
    for (const [k,v] of Object.entries(ITEM_MAP)) {
      if (sub.length>=5 && k.length>=5 && sub.slice(0,5)===k.slice(0,5)) return v;
    }
    return sub;
  }
  for (const [k,v] of Object.entries(ITEM_MAP)) {
    if (t.length>=5 && k.length>=5 && t.slice(0,5)===k.slice(0,5)) return v;
  }
  return t;
}

function isExcluded(item) {
  if (!item || item.startsWith('__')) return true;
  const t = item.replace(/\n/g,'').trim();
  return EXCLUDE_ITEMS.some(ex => t.includes('업무수행능력') && t.includes('/실행력'));
}

let CU = null; // 현재 로그인 사용자
let ALL_SUBS = []; // 기존 호환용 (결과 비교는 GAS 집계값 사용)
let MY_SUBS  = []; // 내 피평가 데이터
let MY_COMPARISON = {}; // 개인/팀/전체 비교 집계
let MY_TEAM_LABEL = '팀 평균';
let MY_MEMBER = null;
let CUR_TYPE = ''; // 현재 선택 탭

// ── GAS 호출 ──
async function gasGet(params) {
  if (!GAS_URL || GAS_URL.includes('여기에')) return null;
  try {
    const url = GAS_URL + '?' + new URLSearchParams(params);
    const res = await fetch(url);
    return await res.json();
  } catch(e) { console.warn('GAS GET 실패:', e); return null; }
}
async function gasPost(body) {
  if (!GAS_URL || GAS_URL.includes('여기에')) return null;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    return await res.json();
  } catch(e) { console.warn('GAS POST 실패:', e); return null; }
}

// ── 로그인 ──
async function doLogin() {
  const name   = document.getElementById('li-name').value.trim();
  const empNo  = document.getElementById('li-emp').value.trim();
  const jumin3 = document.getElementById('li-jumin').value.trim();
  const errEl  = document.getElementById('li-err');
  const btn    = document.getElementById('btn-login');

  if (!name || !empNo || !jumin3) {
    errEl.textContent = '이름, 사번, 주민번호 뒷 3자리를 모두 입력해주세요.';
    return;
  }
  if (empNo.length !== 6) { errEl.textContent = '사번은 6자리입니다.'; return; }
  if (jumin3.length !== 3) { errEl.textContent = '주민번호 뒷 3자리를 입력해주세요.'; return; }

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '⏳ 확인 중...';

  const auth = await gasGet({ action: 'authMember', empNo: empNo, name: encodeURIComponent(name), jumin3: jumin3 });
  if (!auth || !auth.ok) {
    errEl.textContent = (auth && auth.error) || '인증 실패. 다시 확인해주세요.';
    btn.disabled = false; btn.textContent = '조회하기';
    return;
  }

  CU = { name: auth.name, empNo: auth.empNo };
  btn.textContent = '⏳ 결과 불러오는 중...';

  // 내 결과 + 비교 집계 로드
  // 비교값(개인/팀/전체)은 GAS에서 피평가자의 조직 기준으로 계산합니다.
  const myRes = await gasGet({ action: 'getSubmissionsFor', empNo: empNo });
  if (!myRes || myRes.ok === false) {
    errEl.textContent = (myRes && myRes.error) || '평가 결과를 불러오지 못했습니다.';
    btn.disabled = false; btn.textContent = '조회하기';
    return;
  }

  MY_SUBS       = (myRes && myRes.submissions) || [];
  MY_COMPARISON = (myRes && myRes.comparison) || {};
  MY_TEAM_LABEL = (myRes && myRes.teamLabel) || '팀 평균';
  MY_MEMBER     = (myRes && myRes.member) || null;
  ALL_SUBS      = [];

  btn.disabled = false; btn.textContent = '조회하기';
  showResult();
}

function doLogout() {
  CU = null; MY_SUBS = []; ALL_SUBS = []; MY_COMPARISON = {}; MY_TEAM_LABEL = '팀 평균'; MY_MEMBER = null; CUR_TYPE = ''; TEAM_MEMBERS = []; TEAM_ACCESS = null; CUR_MEMBER = null;
  document.getElementById('pg-login').style.display = 'flex';
  document.getElementById('pg-result').style.display = 'none';
  document.getElementById('li-name').value = '';
  document.getElementById('li-emp').value = '';
  document.getElementById('li-jumin').value = '';
  document.getElementById('li-err').textContent = '';
}

// ── 결과 화면 표시 ──
function showResult() {
  document.getElementById('pg-login').style.display = 'none';
  document.getElementById('pg-result').style.display = 'block';
  document.getElementById('top-name').textContent = CU.name + '님';
  document.getElementById('res-name').textContent = CU.name + '님의 평가 결과';
  document.getElementById('res-sub').textContent = `사번: ${CU.empNo} | 총 ${MY_SUBS.length}건의 평가 결과`;

  checkTeamViewAccess();

  // 평가유형 탭 생성
  const types = [...new Set(MY_SUBS.map(s => s.type))];
  const tabBar = document.getElementById('type-tabs');

    tabBar.innerHTML = '';
    document.getElementById('result-cards').innerHTML =

    `<button class="tab-btn${i===0?' on':''}" onclick="selectTab('${t}',this)">${FORM_LABEL[t]||t}</button>`
  ).join('');

  CUR_TYPE = types[0];
  renderCards(CUR_TYPE);
}

function selectTab(type, el) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  // 팀 탭 버튼 스타일 초기화
  const teamBtn = document.getElementById('team-tab-btn');
  if(teamBtn){teamBtn.style.background='#fff3e0';teamBtn.style.color='#e65100';}
  hideTeamView();
  CUR_TYPE = type;
  renderCards(type);
}

// ── 비교 데이터 공통 처리 ──
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function averageArray(arr) {
  const nums = (arr || []).map(Number).filter(Number.isFinite);
  return nums.length ? nums.reduce((a,b)=>a+b,0) / nums.length : null;
}

function fallbackPersonalStats(subs) {
  const raw = {};
  (subs || []).forEach(sub => {
    Object.entries(sub.scores || {}).forEach(([item, score]) => {
      if (isExcluded(item)) return;
      const n = Number(score);
      if (!Number.isFinite(n)) return;
      if (!raw[item]) raw[item] = [];
      raw[item].push(n);
    });
  });
  const out = {};
  Object.entries(raw).forEach(([item, values]) => {
    out[item] = {avg: averageArray(values), n: values.length};
  });
  return out;
}

function buildComparisonRows(type, comparison, subs) {
  const comp = (comparison && comparison[type]) || {};
  const personal = Object.keys(comp.personal || {}).length ? comp.personal : fallbackPersonalStats(subs);
  const team = comp.team || {};
  const overall = comp.overall || {};

  // 같은 표시명으로 매핑되는 원본 키는 평가 건수로 가중하여 하나로 합칩니다.
  const rows = new Map();
  const order = [];

  function addMap(metric, data) {
    Object.entries(data || {}).forEach(([rawKey, stat]) => {
      if (isExcluded(rawKey)) return;
      const label = cleanLabel(rawKey);
      if (!label) return;
      if (!rows.has(label)) {
        rows.set(label, {
          label,
          personalSum:0, personalN:0,
          teamSum:0, teamN:0,
          overallSum:0, overallN:0
        });
        order.push(label);
      }
      const row = rows.get(label);
      const avg = Number(typeof stat === 'object' && stat !== null ? stat.avg : stat);
      const countRaw = Number(typeof stat === 'object' && stat !== null ? stat.n : 1);
      const count = Number.isFinite(countRaw) && countRaw > 0 ? countRaw : 0;
      if (!Number.isFinite(avg) || !count) return;
      row[metric + 'Sum'] += avg * count;
      row[metric + 'N'] += count;
    });
  }

  // 개인 항목 순서를 우선 사용하고, 없는 항목만 팀/전체에서 뒤에 추가합니다.
  addMap('personal', personal);
  addMap('team', team);
  addMap('overall', overall);

  return order.map(label => {
    const row = rows.get(label);
    return {
      label,
      personalAvg: row.personalN ? row.personalSum / row.personalN : null,
      personalN: row.personalN,
      teamAvg: row.teamN ? row.teamSum / row.teamN : null,
      teamN: row.teamN,
      overallAvg: row.overallN ? row.overallSum / row.overallN : null,
      overallN: row.overallN
    };
  }).filter(row => row.personalAvg !== null || row.teamAvg !== null || row.overallAvg !== null);
}

function formatScore(v) {
  if (v === null || v === undefined || v === '') return '-';
  return Number.isFinite(Number(v)) ? Number(v).toFixed(2) : '-';
}

const COMPARE_GAP_THRESHOLD = 0.30;

function scoreDiff(a, b) {
  if (a === null || a === undefined || a === '' || b === null || b === undefined || b === '') return null;
  const aa = Number(a), bb = Number(b);
  return Number.isFinite(aa) && Number.isFinite(bb) ? aa - bb : null;
}

function formatDiff(v) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) return '-';
  const n = Number(v);
  if (Math.abs(n) < 0.005) return '0.00';
  return `${n > 0 ? '+' : ''}${n.toFixed(2)}`;
}

function diffClass(v) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) return 'diff-neutral';
  const n = Number(v);
  if (n >= COMPARE_GAP_THRESHOLD) return 'diff-pos';
  if (n <= -COMPARE_GAP_THRESHOLD) return 'diff-neg';
  return 'diff-neutral';
}

function analyzeComparisonRow(row) {
  const teamDiff = scoreDiff(row.personalAvg, row.teamAvg);
  const overallDiff = scoreDiff(row.personalAvg, row.overallAvg);
  const diffs = [teamDiff, overallDiff].filter(v => v !== null);
  let status = 'similar';
  if (diffs.length && diffs.every(v => v >= COMPARE_GAP_THRESHOLD)) status = 'strength';
  else if (diffs.length && diffs.every(v => v <= -COMPARE_GAP_THRESHOLD)) status = 'improve';
  return {...row, teamDiff, overallDiff, status};
}

function statusLabel(status) {
  return status === 'strength' ? '강점' : status === 'improve' ? '보완' : '유사';
}

function topAnalysisLabels(rows, status, limit = 3) {
  return rows.filter(r => r.status === status)
    .sort((a,b) => {
      const ad = [a.teamDiff,a.overallDiff].filter(v=>v!==null);
      const bd = [b.teamDiff,b.overallDiff].filter(v=>v!==null);
      const av = ad.length ? ad.reduce((x,y)=>x+y,0)/ad.length : 0;
      const bv = bd.length ? bd.reduce((x,y)=>x+y,0)/bd.length : 0;
      return status === 'strength' ? bv-av : av-bv;
    })
    .slice(0, limit).map(r => r.label);
}

// 팀원 결과 조회
// ══════════════════════════════════════════
let TEAM_MEMBERS = [];
let TEAM_ACCESS = null;
let CUR_MEMBER = null;

const ACCESS_UI = {
  2: {tabLabel:'팀 구성원 결과', heading:'팀 구성원 평가 결과', scopeLabel:'같은 팀', groupField:'team', groupLabel:'팀'},
  3: {tabLabel:'실 구성원 결과', heading:'실 구성원 평가 결과', scopeLabel:'같은 실', groupField:'team', groupLabel:'팀'},
  4: {tabLabel:'본부 구성원 결과', heading:'본부 구성원 평가 결과', scopeLabel:'같은 본부', groupField:'sil', groupLabel:'실'},
  5: {tabLabel:'총괄 구성원 결과', heading:'총괄 구성원 평가 결과', scopeLabel:'같은 총괄', groupField:'bonbu', groupLabel:'본부'},
  6: {tabLabel:'전체 구성원 결과', heading:'전체 구성원 평가 결과', scopeLabel:'전체', groupField:'chongGwal', groupLabel:'총괄'}
};

function getAccessUi(level) {
  const n = Number(level);
  return (TEAM_ACCESS && TEAM_ACCESS.scopeMeta) || ACCESS_UI[n] || ACCESS_UI[2];
}

function memberGroupValue(member, meta) {
  const field = (meta && meta.groupField) || 'team';
  return String((member && member[field]) || '').trim() || '기타';
}

function memberSubLabel(member) {
  if (!member) return '';
  return [member.team, member.sil, member.bonbu, member.chongGwal, member.yongupso].find(v => String(v||'').trim()) || '';
}

async function checkTeamViewAccess() {
  try {
    const url = GAS_URL + '?' + new URLSearchParams({
      action: 'getTeamMembers', empNo: CU.empNo || CU.id || ''
    });
    const res  = await fetch(url);
    const data = await res.json();

    if (data && data.ok && data.level >= 2 && data.members && data.members.length > 0) {
      TEAM_ACCESS = data;
      TEAM_MEMBERS = data.members;
      const meta = getAccessUi(data.level);
      const labelEl = document.getElementById('team-tab-btn-label');
      if (labelEl) labelEl.textContent = `👥 ${meta.tabLabel}`;
      document.getElementById('team-tab-wrap').style.display = 'block';
    } else {
      TEAM_ACCESS = data || null;
      TEAM_MEMBERS = [];
      document.getElementById('team-tab-wrap').style.display = 'none';
    }
  } catch(e) { console.warn('팀 권한 체크 실패:', e); }
}

function showTeamView() {
  // 탭 활성화 표시
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  document.getElementById('team-tab-btn').classList.add('on');
  document.getElementById('team-tab-btn').style.background = '#e65100';
  document.getElementById('team-tab-btn').style.color = '#fff';

  document.getElementById('result-cards').style.display = 'none';
  document.getElementById('team-view').style.display = 'block';
  CUR_MEMBER = null;
  renderTeamList();
}

function hideTeamView() {
  document.getElementById('result-cards').style.display = 'block';
  document.getElementById('team-view').style.display = 'none';
  document.getElementById('team-tab-btn').classList.remove('on');
  document.getElementById('team-tab-btn').style.background = '#fff3e0';
  document.getElementById('team-tab-btn').style.color = '#e65100';
}

function renderTeamList() {
  const wrap = document.getElementById('team-view');
  const level = TEAM_ACCESS ? Number(TEAM_ACCESS.level || 2) : 2;
  const meta = getAccessUi(level);

  const groups = {};
  TEAM_MEMBERS.forEach(m => {
    const groupKey = memberGroupValue(m, meta);
    if (!groups[groupKey]) groups[groupKey] = [];
    groups[groupKey].push(m);
  });

  const groupEntries = Object.entries(groups).sort((a,b) => a[0].localeCompare(b[0], 'ko'));
  groupEntries.forEach(([,members]) => members.sort((a,b) => String(a.name||'').localeCompare(String(b.name||''), 'ko')));

  let html = `<div class="card">
    <h3>👥 ${escapeHtml(meta.heading)} <span class="scope-badge">조회범위: ${escapeHtml(meta.scopeLabel)}</span></h3>
    <p style="font-size:14px;color:var(--tx3);margin-bottom:16px">
      이름을 클릭하면 조회 권한 범위 안에서 해당 구성원의 평가 결과를 확인할 수 있습니다.<br>
      <span style="color:#e64a19">※ 평가자 정보는 익명으로 처리됩니다.</span>
    </p>`;

  groupEntries.forEach(([groupName, members]) => {
    html += `<div class="org-group">
      <div class="org-group-title">📂 ${escapeHtml(meta.groupLabel)} · ${escapeHtml(groupName)}</div>
      <div class="member-list">`;
    members.forEach(m => {
      html += `<button type="button" class="member-chip" data-emp="${escapeHtml(m.empNo)}" data-name="${escapeHtml(m.name)}">
        ${escapeHtml(m.name)}
        <span class="chip-team">${escapeHtml(memberSubLabel(m))}</span>
      </button>`;
    });
    html += `</div></div>`;
  });

  html += `</div><div id="member-result-wrap"></div>`;
  wrap.innerHTML = html;

  wrap.querySelectorAll('.member-chip').forEach(btn => {
    btn.addEventListener('click', () => loadMemberResult(btn.dataset.emp || '', btn.dataset.name || ''));
  });
}

async function loadMemberResult(empNo, name) {
  // 칩 선택 표시
  document.querySelectorAll('.member-chip').forEach(c => c.classList.remove('on'));
  const chip = document.getElementById('chip-'+empNo);
  if(chip) chip.classList.add('on');

  const wrap = document.getElementById('member-result-wrap');
  wrap.innerHTML = `<div class="member-loading">⏳ ${name}님의 평가 결과를 불러오는 중...</div>`;

  try {
    const url = GAS_URL + '?' + new URLSearchParams({
      action: 'getMemberResult', empNo: empNo, viewerEmpNo: CU && CU.empNo ? CU.empNo : ''
    });
    const res  = await fetch(url);
    const data = await res.json();

    if (!data || !data.ok) {
      wrap.innerHTML = `<div class="no-data">데이터를 불러오지 못했습니다.</div>`;
      return;
    }

    CUR_MEMBER = data;
    renderMemberResult(data);
  } catch(e) {
    wrap.innerHTML = `<div class="no-data">오류가 발생했습니다. 다시 시도해주세요.</div>`;
  }
}

function renderMemberResult(data) {
  const wrap = document.getElementById('member-result-wrap');
  const subs = data.submissions || [];

  if (!subs.length) {
    wrap.innerHTML = `<div class="card"><div class="no-data">
      <div class="ico">📭</div>
      <p>${escapeHtml(data.name)}님의 평가 결과가 없습니다.</p>
    </div></div>`;
    return;
  }

  const types = [...new Set(subs.map(s => s.type).filter(Boolean))];
  const m = data.member || {};
  const orgText = [m.chongGwal, m.bonbu, m.sil, m.team, m.yongupso].filter(Boolean).join(' / ');

  wrap.innerHTML = `
    <div class="card" style="border-top:3px solid var(--nv2)">
      <h3 style="margin-bottom:8px">📊 ${escapeHtml(data.name)}님의 평가 결과</h3>
      ${orgText ? `<div style="font-size:13px;color:var(--tx3);margin-bottom:14px">소속: ${escapeHtml(orgText)}</div>` : ''}
      <div class="tab-bar" id="member-type-tabs" style="margin-bottom:0">
        ${types.map((t,i) => `
          <button type="button" class="tab-btn${i===0?' on':''}" data-type="${escapeHtml(t)}">
            ${escapeHtml(FORM_LABEL[t]||t)}
          </button>`).join('')}
      </div>
    </div>
    <div id="member-cards"></div>`;

  const memberTabs = wrap.querySelectorAll('#member-type-tabs .tab-btn');
  memberTabs.forEach(btn => {
    btn.addEventListener('click', () => renderMemberCards(btn.dataset.type || '', btn, data.name));
  });
  if (types.length > 0) renderMemberCards(types[0], null, data.name);
}

function renderMemberCards(type, el, memberName) {
  if(el) {
    document.querySelectorAll('#member-type-tabs .tab-btn').forEach(b=>b.classList.remove('on'));
    el.classList.add('on');
  }

  const subs = (CUR_MEMBER?.submissions||[]).filter(s => s.type === type);
  const cont = document.getElementById('member-cards');
  if (!cont) return;

  renderComparisonCards({
    container: cont,
    canvasId: 'member-radar-cv',
    type,
    subs,
    comparison: (CUR_MEMBER && CUR_MEMBER.comparison) || {},
    personLabel: `${memberName}님 평균`,
    teamLabel: (CUR_MEMBER && CUR_MEMBER.teamLabel) || '팀 평균',
    titleLabel: `${FORM_LABEL[type]||type} 결과`
  });
}

function drawRadar(canvasId, labels, datasets) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const R  = Math.min(W,H) * 0.36;
  const N  = labels.length;
  const maxVal = 6;
  const tooltip = document.getElementById(canvasId + '-tooltip');
  const wrap = canvas.parentElement;
  const hoverPoints = [];
  ctx.clearRect(0, 0, W, H);

  if (N < 3) {
    ctx.fillStyle = '#888'; ctx.font = '15px sans-serif';
    ctx.fillText('항목이 3개 이상이어야 차트를 표시합니다.', 20, H/2);
    if (tooltip) tooltip.style.display = 'none';
    return;
  }

  const angle = i => (Math.PI*2*i/N) - Math.PI/2;
  const pt = (i, val) => ({
    x: cx + R*(val/maxVal)*Math.cos(angle(i)),
    y: cy + R*(val/maxVal)*Math.sin(angle(i))
  });

  // 배경 그물망
  for (let r = 1; r <= maxVal; r++) {
    ctx.beginPath();
    ctx.strokeStyle = r === maxVal ? '#b0bcd0' : '#dde3ee';
    ctx.lineWidth = r === maxVal ? 1.5 : 1;
    for (let i = 0; i < N; i++) {
      const p = pt(i, r);
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    }
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#aab'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(r, cx + 6, cy - R*(r/maxVal) + 4);
  }

  // 축 선
  for (let i = 0; i < N; i++) {
    const p = pt(i, maxVal);
    ctx.beginPath(); ctx.strokeStyle = '#c8d0de'; ctx.lineWidth = 1;
    ctx.moveTo(cx, cy); ctx.lineTo(p.x, p.y); ctx.stroke();
  }

  // 라벨
  for (let i = 0; i < N; i++) {
    const p = pt(i, maxVal * 1.2);
    ctx.fillStyle = '#2a3a5a'; ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = p.x < cx-5 ? 'right' : p.x > cx+5 ? 'left' : 'center';
    const lbl = labels[i].length > 12 ? labels[i].slice(0,12)+'…' : labels[i];
    ctx.fillText(lbl, p.x, p.y + 4);
  }

  // 데이터
  datasets.forEach(ds => {
    const values = (ds.data || []).map(v => {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    });
    if (!values.length || values.every(v => v === null || v === 0)) return;

    ctx.beginPath();
    values.forEach((v, i) => {
      const plotValue = v === null ? 0 : v;
      const p = pt(i, plotValue);
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.strokeStyle = ds.color; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = ds.color + '28'; ctx.fill();

    values.forEach((v, i) => {
      if (v === null || v <= 0) return;
      const p = pt(i, v);
      ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI*2);
      ctx.fillStyle = ds.color; ctx.fill();
      hoverPoints.push({x:p.x, y:p.y, itemIndex:i});
    });
  });

  function hideTooltip() {
    if (tooltip) tooltip.style.display = 'none';
  }

  function showTooltip(clientX, clientY) {
    if (!tooltip || !wrap || !hoverPoints.length) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;
    const hitRadius = 18 * Math.max(scaleX, scaleY);

    let nearest = null;
    let nearestDist = Infinity;
    hoverPoints.forEach(p => {
      const d = Math.hypot(p.x - x, p.y - y);
      if (d <= hitRadius && d < nearestDist) { nearest = p; nearestDist = d; }
    });
    if (!nearest) { hideTooltip(); return; }

    const idx = nearest.itemIndex;
    const rows = datasets.map(ds => {
      const raw = ds.data ? ds.data[idx] : null;
      const n = raw === null || raw === undefined || raw === '' ? null : Number(raw);
      return {label: ds.label, value: Number.isFinite(n) ? n : null};
    }).filter(r => r.value !== null);

    tooltip.innerHTML = `<strong>${escapeHtml(labels[idx] || '')}</strong>` +
      rows.map(r => `<div class="tip-row"><span>${escapeHtml(r.label)}</span><span class="tip-value">${r.value.toFixed(2)}점</span></div>`).join('');
    tooltip.style.display = 'block';

    const wrapRect = wrap.getBoundingClientRect();
    const px = clientX - wrapRect.left + 12;
    const py = clientY - wrapRect.top - 12;
    const maxLeft = Math.max(6, wrap.clientWidth - tooltip.offsetWidth - 6);
    const maxTop = Math.max(6, wrap.clientHeight - tooltip.offsetHeight - 6);
    tooltip.style.left = `${Math.max(6, Math.min(px, maxLeft))}px`;
    tooltip.style.top = `${Math.max(6, Math.min(py, maxTop))}px`;
  }

  canvas.onmousemove = e => showTooltip(e.clientX, e.clientY);
  canvas.onmouseleave = hideTooltip;
  canvas.ontouchstart = e => { const t = e.touches && e.touches[0]; if (t) showTooltip(t.clientX, t.clientY); };
  canvas.ontouchmove = e => { const t = e.touches && e.touches[0]; if (t) showTooltip(t.clientX, t.clientY); };
  canvas.ontouchend = () => setTimeout(hideTooltip, 1200);
}

</script>
