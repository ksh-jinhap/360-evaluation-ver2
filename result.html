<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>다면평가 개인결과 조회</title>
<style>
:root{--nv:#1a3a5c;--nv2:#2563a8;--bd:#d0d7e3;--bd2:#b0bcd0;--bg:#f4f6fb;--tx:#1a2a3a;--tx2:#3a5a7a;--tx3:#7a90a8;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

/* ── 로그인 ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a3a5c 0%,#2563a8 100%)}
.login-box{background:#fff;border-radius:20px;padding:44px 38px 36px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(26,58,92,.18)}
.login-logo{width:64px;height:64px;background:var(--nv2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px}
.login-title{text-align:center;font-size:24px;font-weight:800;color:var(--nv);margin-bottom:4px}
.login-sub{text-align:center;font-size:14px;color:var(--tx3);margin-bottom:28px}
.lfield{margin-bottom:14px}
.lfield label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.lfield input{width:100%;padding:11px 14px;border:1.5px solid var(--bd);border-radius:8px;font-size:15px;font-family:inherit;outline:none;transition:.15s}
.lfield input:focus{border-color:var(--nv2);box-shadow:0 0 0 3px rgba(37,99,168,.12)}
.btn-login{width:100%;padding:13px;background:var(--nv2);color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;transition:.15s}
.btn-login:hover{background:#1a3a5c}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.login-err{color:#c62828;font-size:14px;text-align:center;margin-top:10px;min-height:20px}
.login-notice{text-align:center;font-size:13px;color:var(--tx3);margin-top:16px;line-height:1.6}

/* ── 결과 화면 ── */
.result-wrap{display:none;min-height:100vh;background:var(--bg)}
.topbar{background:var(--nv);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-l{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.topbar-badge{background:#fff2;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600}
.topbar-r{display:flex;align-items:center;gap:12px;font-size:14px}
.btn-out{background:#fff2;border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit}
.btn-out:hover{background:#fff3}

.result-inner{max-width:900px;margin:0 auto;padding:28px 16px 60px}
.result-name{font-size:22px;font-weight:800;color:var(--nv);margin-bottom:6px}
.result-sub{font-size:14px;color:var(--tx3);margin-bottom:24px}

/* 탭 */
.tab-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:8px 18px;border:1.5px solid var(--bd);border-radius:20px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--tx2);transition:.15s}
.tab-btn.on{background:var(--nv2);border-color:var(--nv2);color:#fff}

/* 카드 */
.card{background:#fff;border-radius:var(--r);box-shadow:0 2px 12px rgba(26,58,92,.07);padding:24px;margin-bottom:20px}
.card h3{font-size:17px;font-weight:700;color:var(--nv);margin-bottom:16px}

/* 레이더 */
.radar-wrap{position:relative;width:100%;max-width:820px;margin:0 auto}
.radar-wrap canvas{display:block;width:100%;height:auto;cursor:crosshair}
.radar-tooltip{display:none;position:absolute;pointer-events:none;z-index:20;background:rgba(26,42,58,.96);color:#fff;padding:8px 10px;border-radius:7px;font-size:12px;line-height:1.45;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.radar-tooltip strong{font-size:12px;font-weight:800}
.radar-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:14px;justify-content:center}
.radar-legend span{display:flex;align-items:center;gap:6px}
.radar-legend i{display:inline-block;width:22px;height:3px;border-radius:2px}

/* 상사평가 항목 설명 */
.criteria-guide{margin-top:24px;padding-top:20px;border-top:1px solid var(--bd)}
.criteria-guide-title{font-size:15px;font-weight:800;color:var(--nv);margin-bottom:10px}
.criteria-guide-scroll{width:100%;overflow-x:auto;padding-bottom:4px}
.criteria-guide img{display:block;width:100%;min-width:720px;height:auto;border:1px solid var(--bd2);background:#fff}
.criteria-guide-note{font-size:12px;color:var(--tx3);margin-top:7px;line-height:1.5}

/* 점수표 */
.score-tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.score-tbl th{background:#f0f4fa;color:var(--tx2);padding:9px 12px;text-align:left;font-weight:700;border-bottom:2px solid var(--bd)}
.score-tbl td{padding:8px 12px;border-bottom:1px solid var(--bd);color:var(--tx)}
.score-tbl tr:last-child td{border-bottom:none}
.score-my{font-weight:700;color:#1565c0;text-align:center}
.score-team{color:#2e7d52;text-align:center}
.score-all{color:#e64a19;text-align:center}

/* no-data */
.no-data{text-align:center;padding:40px 20px;color:var(--tx3);font-size:15px}

/* 척도 설명 */
.scale-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.scale-chip{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.sc6{background:#1565c0}.sc5{background:#2e7d52}.sc4{background:#558b2f}
.sc3{background:#f9a825;color:#333}.sc2{background:#e64a19}.sc1{background:#b71c1c}

@media(max-width:600px){
  .login-box{padding:32px 20px 28px;margin:16px}
  .result-inner{padding:16px 10px 40px}
  .score-tbl{font-size:13px}
}
</style>


</head>
<body>

<!-- 로그인 화면 -->
<div class="login-wrap" id="pg-login">
  <div class="login-box">
    <div class="login-logo">📊</div>
    <div class="login-title">개인결과 조회</div>
    <div class="login-sub">다면평가 2026</div>
    <div class="lfield">
      <label>이름</label>
      <input type="text" id="li-name" placeholder="이름을 입력하세요" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="lfield">
      <label>사번</label>
      <input type="text" id="li-emp" placeholder="숫자 6자리" maxlength="6" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="lfield">
      <label>주민번호 뒷 3자리</label>
      <input type="password" id="li-jumin" placeholder="숫자 3자리" maxlength="3" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button type="button" class="btn-login" id="btn-login" onclick="doLogin()">조회하기</button>
    <div class="login-err" id="li-err"></div>
    <div class="login-notice">해당 평가는 모두 익명으로 진행되었습니다.<br>본인의 결과만 조회 가능합니다.</div>
  </div>
</div>

<!-- 결과 화면 -->
<div class="result-wrap" id="pg-result">
  <div class="topbar">
    <div class="topbar-l">
      📊 <span>개인결과 조회</span>
      <span class="topbar-badge">2026년도</span>
    </div>
    <div class="topbar-r">
      <span id="top-name"></span>
      <button class="btn-out" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="result-inner">
    <div class="result-name" id="res-name"></div>
    <div class="result-sub" id="res-sub"></div>

    <!-- 평가유형 탭 -->
    <div class="tab-bar" id="type-tabs"></div>

    <!-- 결과 카드 영역 -->
    <div id="result-cards"></div>
  </div>
</div>

  '상황의 핵심을 정확히 판단': '목표설정 및 판단력 Ⅱ',

  '여러 가지 상황을 종합적으로': '결단력 Ⅰ',

  '어려운 목표를 포기하지 않고': '업무추진력 Ⅱ',
};
const EXCLUDE_ITEMS = ['업무수행능력/실행력'];

function cleanLabel(item) {
  if (!item) return item;
  // 줄바꿈 제거 후 trim
  const trimmed = item.replace(/\n/g, '').trim();

  // 1. 정확히 일치
  if (ITEM_MAP[trimmed]) return ITEM_MAP[trimmed];

  // 2. "/" 기준으로 분리 → 뒷부분(세부항목)으로 ITEM_MAP 매칭
  const slashIdx = trimmed.lastIndexOf('/');
  if (slashIdx > -1) {
    const subItem = trimmed.slice(slashIdx + 1).trim();
    // 세부항목으로 정확 매칭
    if (ITEM_MAP[subItem]) return ITEM_MAP[subItem];
    // 세부항목으로 앞 10글자 부분 매칭
    for (const [key, val] of Object.entries(ITEM_MAP)) {
      const matchLen = Math.min(10, key.trim().length, subItem.length);
      if (subItem.slice(0, matchLen) === key.trim().slice(0, matchLen)) return val;
    }
    return subItem; // 매핑 없으면 세부항목 그대로
  }

  // 3. 앞 10글자 부분 매칭
  for (const [key, val] of Object.entries(ITEM_MAP)) {
    const matchLen = Math.min(10, key.trim().length, trimmed.length);
    if (trimmed.slice(0, matchLen) === key.trim().slice(0, matchLen)) return val;
  }

  return trimmed;
}

function isExcluded(item) {
  if (!item || item.startsWith('__')) return true;
  const clean = item.replace(/\n/g, '').trim();
  return EXCLUDE_ITEMS.some(ex => clean.includes(ex) || (clean.includes('/실행력') && clean.includes('업무수행능력')));
}


const SCOPE_LABEL = {
  1: '본인',
  2: '같은 팀',
  3: '같은 실',
  4: '같은 본부',
  5: '같은 총괄',
  6: '전체'
};

function toLevel(value) {
  const n = Number(value);
  return Number.isFinite(n) && n >= 1 && n <= 6 ? Math.floor(n) : 1;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function normalizeScores(scores) {
  if (!scores) return {};
  if (typeof scores === 'string') {
    try { return JSON.parse(scores) || {}; } catch(e) { return {}; }
  }
  return (typeof scores === 'object' && !Array.isArray(scores)) ? scores : {};
}

function normalizeSubmission(sub) {
  const row = sub && typeof sub === 'object' ? sub : {};
  return {
    ...row,
    type: String(row.type || row.formType || '').trim(),
    targetEmpNo: String(row.targetEmpNo || row.empNo || '').trim(),
    targetName: String(row.targetName || row.name || '').trim(),
    chonggwal: String(row.chonggwal || row.totalOrg || '').trim(),
    bonbu: String(row.bonbu || row.division || '').trim(),
    sil: String(row.sil || row.office || '').trim(),
    team: String(row.team || row.targetTeam || '').trim(),
    branch: String(row.branch || row.salesOffice || '').trim(),
    scores: normalizeScores(row.scores)
  };
}

function forEachScore(scores, callback) {
  const obj = normalizeScores(scores);
  Object.entries(obj).forEach(([key, val]) => {
    if (val && typeof val === 'object' && !Array.isArray(val)) {
      Object.entries(val).forEach(([item, score]) => callback(item, score));
    } else {
      callback(key, val);
    }
  });
}

function toScoreNumber(value) {
  if (value === null || value === undefined || value === '') return null;
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? n : null;
}

let CU = null; // 현재 로그인 사용자
let ALL_SUBS = []; // 전체 제출 데이터 (팀/전체 평균용)
let MY_SUBS  = []; // 내 피평가 데이터
let CUR_TYPE = ''; // 현재 선택 탭

// ── GAS 호출 ──
async function gasGet(params) {
  if (!GAS_URL || GAS_URL.includes('여기에')) return null;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);

  try {
    const url = GAS_URL + '?' + new URLSearchParams(params).toString();
    const res = await fetch(url, {
      method: 'GET',
      cache: 'no-store',
      signal: controller.signal
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch(e) {
    console.warn('GAS GET 실패:', e);
    return null;
  } finally {
    clearTimeout(timer);
  }
}
async function gasPost(body) {
  if (!GAS_URL || GAS_URL.includes('여기에')) return null;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    return await res.json();
  } catch(e) { console.warn('GAS POST 실패:', e); return null; }
}

// ── 로그인 ──
async function doLogin() {
  const name   = document.getElementById('li-name').value.trim();
  const empNo  = document.getElementById('li-emp').value.trim();
  const jumin3 = document.getElementById('li-jumin').value.trim();
  const errEl  = document.getElementById('li-err');
  const btn    = document.getElementById('btn-login');

  if (!name || !empNo || !jumin3) {
    errEl.textContent = '이름, 사번, 인증값 3자리를 모두 입력해주세요.';
    return;
  }
  if (!/^\d{6}$/.test(empNo)) {
    errEl.textContent = '사번은 숫자 6자리입니다.';
    return;
  }
  if (!/^\d{3}$/.test(jumin3)) {
    errEl.textContent = '인증값은 숫자 3자리입니다.';
    return;
  }

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '확인 중...';

  try {
    const auth = await gasGet({
      action: 'authMember',
      empNo: empNo,
      name: name,
      jumin3: jumin3
    });

    if (!auth || !auth.ok || !auth.token) {
      errEl.textContent = (auth && auth.error) || '인증에 실패했습니다. 입력값 또는 서버 연결을 확인해주세요.';
      return;
    }

    const authLevel = toLevel(auth.level || auth.authLevel || auth.scopeLevel || 1);
    CU = {
      name: String(auth.name || name).trim(),
      empNo: String(auth.empNo || empNo).trim(),
      token: auth.token,
      level: authLevel,
      scopeLabel: auth.scopeLabel || SCOPE_LABEL[authLevel] || '본인',
      org: auth.org || {
        chonggwal: auth.chonggwal || '',
        bonbu: auth.bonbu || '',
        sil: auth.sil || '',
        team: auth.team || '',
        branch: auth.branch || ''
      }
    };

    btn.textContent = '결과 불러오는 중...';
    const result = await gasGet({ action: 'getResultData', token: CU.token });

    if (!result || !result.ok) {
      errEl.textContent = (result && result.error) || '평가 결과를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
      CU = null;
      return;
    }

    if (result.member) {
      CU = {
        ...CU,
        name: result.member.name || CU.name,
        empNo: result.member.empNo || CU.empNo,
        level: toLevel(result.member.level || CU.level),
        scopeLabel: result.scopeLabel || result.member.scopeLabel || CU.scopeLabel,
        org: result.member.org || CU.org
      };
    } else if (result.scopeLabel) {
      CU.scopeLabel = result.scopeLabel;
    }

    MY_SUBS  = (result.mySubmissions || result.mySubs || []).map(normalizeSubmission);
    ALL_SUBS = (result.scopeSubmissions || result.allSubmissions || result.submissions || []).map(normalizeSubmission);
    showResult();
  } catch (e) {
    console.error('조회 처리 실패:', e);
    errEl.textContent = '조회 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
  } finally {
    btn.disabled = false;
    btn.textContent = '조회하기';
  }
}

    tabBar.innerHTML = '';
    document.getElementById('result-cards').innerHTML =
      '<div class="no-data">아직 제출된 평가 결과가 없습니다.</div>';

    btn.addEventListener('click', () => selectTab(btn.dataset.type, btn));

function selectTab(type, el) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  CUR_TYPE = type;
  renderCards(type);
}

// ── 카드 렌더링 ──
function renderCards(type) {
  const mySubs  = MY_SUBS.filter(s => s.type === type);
  const allSubs = ALL_SUBS.filter(s => s.type === type);
  const container = document.getElementById('result-cards');
  const isSuperMgr = type === 'super_mgr';
  const isSuperCeo = type === 'super_ceo';
  const showSuperCriteria = isSuperMgr || isSuperCeo;
  const level = toLevel(CU?.level || 1);
  const scopeLabel = CU?.scopeLabel || SCOPE_LABEL[level] || '본인';
  const scopeAverageLabel = scopeLabel === '전체' ? '전체 평균' : `${scopeLabel} 평균`;
  const showScopeAverage = level >= 2;
  const showTeamAverage = level >= 3 && !isSuperCeo;
  const teamAverageLabel = '같은 팀 평균';

  if (mySubs.length === 0) {
    container.innerHTML = '<div class="no-data">해당 유형의 평가 결과가 없습니다.</div>';
    return;
  }

  const myTeam = mySubs[0]?.team || CU?.org?.team || '';
  const myRaw = {}, scopeRaw = {}, teamRaw = {};

  // 내 점수 집계
  mySubs.forEach(sub => {
    forEachScore(sub.scores, (item, score) => {
      if (isExcluded(item)) return;
      const n = toScoreNumber(score);
      if (n === null) return;
      if (!myRaw[item]) myRaw[item] = [];
      myRaw[item].push(n);
    });
  });

  // 조회범위/같은 팀 평균 집계
  allSubs.forEach(sub => {
    forEachScore(sub.scores, (item, score) => {
      if (isExcluded(item)) return;
      const n = toScoreNumber(score);
      if (n === null) return;
      if (!scopeRaw[item]) scopeRaw[item] = [];
      scopeRaw[item].push(n);
      if (myTeam && sub.team === myTeam) {
        if (!teamRaw[item]) teamRaw[item] = [];
        teamRaw[item].push(n);
      }
    });
  });

  const avg = arr => arr && arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;

  // 원본 키 → 표시명 (중복 제거)
  const seen = new Set();
  const items = [];
  Object.keys(myRaw).forEach(k => {
    const label = cleanLabel(k);
    if (!seen.has(label)) { seen.add(label); items.push({ rawKey: k, label }); }
  });

  if (items.length === 0) {
    container.innerHTML = '<div class="no-data">표시할 점수 항목이 없습니다.</div>';
    return;
  }

  const labels     = items.map(i => i.label);
  const myAvgs     = items.map(i => avg(myRaw[i.rawKey]) || 0);
  const scopeAvgs  = items.map(i => avg(scopeRaw[i.rawKey]));
  const teamAvgs   = items.map(i => avg(teamRaw[i.rawKey]));

  container.innerHTML = `
    <div class="card">
      <h3>📊 ${escapeHtml(FORM_LABEL[type]||type)} 결과 <span style="font-size:13px;font-weight:400;color:var(--tx3)">(${mySubs.length}명 평가)</span></h3>
      <div class="scale-wrap">
        <div class="scale-chip sc6">6 매우긍정</div>
        <div class="scale-chip sc5">5 긍정</div>
        <div class="scale-chip sc4">4 약간긍정</div>
        <div class="scale-chip sc3">3 약간부정</div>
        <div class="scale-chip sc2">2 부정</div>
        <div class="scale-chip sc1">1 매우부정</div>
      </div>
      <div class="radar-wrap">
        <canvas id="radar-cv" width="820" height="620" aria-label="평가 점수 레이더 차트"></canvas>
        <div class="radar-tooltip" id="radar-tooltip" role="status" aria-live="polite"></div>
      </div>
      <div class="radar-legend">
        <span><i style="background:#1565c0"></i> 본인 평균</span>
        ${showTeamAverage ? `<span><i style="background:#2e7d52"></i> ${escapeHtml(teamAverageLabel)}</span>` : ''}
        ${showScopeAverage ? `<span><i style="background:#e64a19"></i> ${escapeHtml(scopeAverageLabel)}</span>` : ''}
      </div>
      ${showSuperCriteria ? `
        <div class="criteria-guide">
          <div class="criteria-guide-title">상사평가 항목 설명</div>
          <div class="criteria-guide-scroll">
            <img src="${SUPER_CRITERIA_IMAGE}" alt="상사평가 13개 항목별 행동 기준 설명표">
          </div>
          <div class="criteria-guide-note">화면이 좁은 경우 표를 좌우로 이동하여 확인할 수 있습니다.</div>
        </div>` : ''}
    </div>
    <div class="card">
      <h3>📋 항목별 점수</h3>
      <div style="overflow-x:auto">
        <table class="score-tbl">
          <thead>
            <tr>
              <th>평가 항목</th>
              <th style="text-align:center;color:#1565c0">본인 평균</th>
              ${showTeamAverage ? `<th style="text-align:center;color:#2e7d52">${escapeHtml(teamAverageLabel)}</th>` : ''}
              ${showScopeAverage ? `<th style="text-align:center;color:#e64a19">${escapeHtml(scopeAverageLabel)}</th>` : ''}
            </tr>
          </thead>
          <tbody>
            ${items.map((item,i) => `
              <tr>
                <td>${escapeHtml(item.label)}</td>
                <td class="score-my">${myAvgs[i].toFixed(2)}</td>
                ${showTeamAverage ? `<td class="score-team">${teamAvgs[i]!==null ? teamAvgs[i].toFixed(2) : '-'}</td>` : ''}
                ${showScopeAverage ? `<td class="score-all">${scopeAvgs[i]!==null ? scopeAvgs[i].toFixed(2) : '-'}</td>` : ''}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  const radarDatasets = [
    { label:'본인 평균', data: myAvgs, color:'#1565c0' }
  ];
  if (showTeamAverage) {
    radarDatasets.push({
      label: teamAverageLabel,
      data: teamAvgs.map(v=>v||0),
      color:'#2e7d52'
    });
  }
  if (showScopeAverage) {
    radarDatasets.push({
      label: scopeAverageLabel,
      data: scopeAvgs.map(v=>v||0),
      color:'#e64a19'
    });
  }
  setTimeout(() => drawRadar('radar-cv', labels, radarDatasets), 50);
}

function drawRadar(canvasId, labels, datasets) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2 - 8;
  // 긴 항목명이 잘리지 않도록 차트 반경을 줄이고 라벨 영역을 넓힘
  const R  = Math.min(W,H) * 0.30;
  const N  = labels.length;
  const maxVal = 6;
  ctx.clearRect(0, 0, W, H);

  if (N < 3) {
    ctx.fillStyle = '#888'; ctx.font = '15px sans-serif';
    ctx.fillText('항목이 3개 이상이어야 차트를 표시합니다.', 20, H/2);
    return;
  }

  const angle = i => (Math.PI*2*i/N) - Math.PI/2;
  const pt = (i, val) => ({
    x: cx + R*(val/maxVal)*Math.cos(angle(i)),
    y: cy + R*(val/maxVal)*Math.sin(angle(i))
  });

  // 배경 그물망
  for (let r = 1; r <= maxVal; r++) {
    ctx.beginPath();
    ctx.strokeStyle = r === maxVal ? '#b0bcd0' : '#dde3ee';
    ctx.lineWidth = r === maxVal ? 1.5 : 1;
    for (let i = 0; i < N; i++) {
      const p = pt(i, r);
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    }
    ctx.closePath(); ctx.stroke();
    // 눈금
    ctx.fillStyle = '#aab'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(r, cx + 6, cy - R*(r/maxVal) + 4);
  }

  // 축 선
  for (let i = 0; i < N; i++) {
    const p = pt(i, maxVal);
    ctx.beginPath(); ctx.strokeStyle = '#c8d0de'; ctx.lineWidth = 1;
    ctx.moveTo(cx, cy); ctx.lineTo(p.x, p.y); ctx.stroke();
  }

  // 라벨: 전체 문구를 2줄까지 표시하고 글자 크기를 확대
  const splitLabelLines = (label, maxChars = 10) => {
    const value = String(label || '').trim();
    if (value.length <= maxChars) return [value];

    const words = value.split(/\s+/).filter(Boolean);
    const lines = [];
    let current = '';

    words.forEach(word => {
      if (word.length > maxChars) {
        if (current) { lines.push(current); current = ''; }
        for (let start = 0; start < word.length; start += maxChars) {
          lines.push(word.slice(start, start + maxChars));
        }
        return;
      }

      const candidate = current ? `${current} ${word}` : word;
      if (candidate.length <= maxChars) {
        current = candidate;
      } else {
        if (current) lines.push(current);
        current = word;
      }
    });
    if (current) lines.push(current);

    // 예상보다 길게 나뉘는 경우에도 내용을 생략하지 않고 두 줄에 균등 배치
    if (lines.length > 2) {
      const midpoint = Math.ceil(value.length / 2);
      let splitAt = value.lastIndexOf(' ', midpoint);
      if (splitAt < Math.floor(value.length * 0.35)) splitAt = midpoint;
      return [value.slice(0, splitAt).trim(), value.slice(splitAt).trim()];
    }
    return lines;
  };

  for (let i = 0; i < N; i++) {
    const p = pt(i, maxVal * 1.34);
    const lines = splitLabelLines(labels[i], 10);
    const lineHeight = 20;
    const startY = p.y - ((lines.length - 1) * lineHeight) / 2;

    ctx.fillStyle = '#2a3a5a';
    ctx.font = "bold 16px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.textAlign = p.x < cx-8 ? 'right' : p.x > cx+8 ? 'left' : 'center';
    ctx.textBaseline = 'middle';
    lines.forEach((line, lineIndex) => {
      ctx.fillText(line, p.x, startY + lineIndex * lineHeight);
    });
  }

  // 데이터
  const hoverPoints = [];
  datasets.forEach(ds => {
    if (!ds.data || ds.data.every(v => v===0)) return;
    ctx.beginPath();
    ds.data.forEach((v, i) => {
      const p = pt(i, v);
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.strokeStyle = ds.color; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = ds.color + '28'; ctx.fill();
    ds.data.forEach((v, i) => {
      if (!Number.isFinite(v) || v <= 0) return;
      const p = pt(i, v);
      ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI*2);
      ctx.fillStyle = ds.color; ctx.fill();
      hoverPoints.push({
        x: p.x, y: p.y, value: v, itemIndex: i,
        itemLabel: labels[i], seriesLabel: ds.label
      });
    });
  });

  // 데이터 점에 마우스를 올리면 항목명과 점수를 표시
  const tooltip = document.getElementById('radar-tooltip');
  const wrap = canvas.parentElement;
  const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));

  const showTooltip = (clientX, clientY) => {
    if (!tooltip || !wrap) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;
    const hitRadius = 15 * Math.max(scaleX, scaleY);

    let nearest = null;
    let nearestDist = Infinity;
    hoverPoints.forEach(point => {
      const dist = Math.hypot(point.x - x, point.y - y);
      if (dist <= hitRadius && dist < nearestDist) {
        nearest = point;
        nearestDist = dist;
      }
    });

    if (!nearest) {
      tooltip.style.display = 'none';
      canvas.style.cursor = 'crosshair';
      return;
    }

    const sameItemPoints = hoverPoints.filter(point => point.itemIndex === nearest.itemIndex);
    const scoreLines = sameItemPoints
      .map(point => `${escapeHtml(point.seriesLabel)}: ${Number(point.value).toFixed(2)}점`)
      .join('<br>');
    tooltip.innerHTML = `<strong>${escapeHtml(nearest.itemLabel)}</strong><br>${scoreLines}`;
    tooltip.style.display = 'block';
    canvas.style.cursor = 'pointer';

    const wrapRect = wrap.getBoundingClientRect();
    const pointerX = clientX - wrapRect.left;
    const pointerY = clientY - wrapRect.top;
    const maxLeft = Math.max(6, wrap.clientWidth - tooltip.offsetWidth - 6);
    const maxTop = Math.max(6, wrap.clientHeight - tooltip.offsetHeight - 6);
    tooltip.style.left = `${Math.min(pointerX + 12, maxLeft)}px`;
    tooltip.style.top = `${Math.max(6, Math.min(pointerY - tooltip.offsetHeight / 2, maxTop))}px`;
  };

  canvas.addEventListener('mousemove', e => showTooltip(e.clientX, e.clientY));
  canvas.addEventListener('mouseleave', () => {
    if (tooltip) tooltip.style.display = 'none';
    canvas.style.cursor = 'crosshair';
  });
  canvas.addEventListener('touchstart', e => {
    const touch = e.touches[0];
    if (touch) showTooltip(touch.clientX, touch.clientY);
  }, {passive:true});
  canvas.addEventListener('touchmove', e => {
    const touch = e.touches[0];
    if (touch) showTooltip(touch.clientX, touch.clientY);
  }, {passive:true});
}

</script>
</body>
</html>
